# D4 sensor-order permutation retrains (post-result exploratory); order k on split seed k; validation only.
description: D4 sensor-order permutation retrains (post-result exploratory); order k on split seed k; validation only.
experiment_id: exp_B18
concerns:
- R2.16
- R1.39
family: r3_D4
protocol: configs/protocols/protocol_P2.yaml
selection: configs/selections/exp_B18_config_selection_frozen.json
subsets:
- FD001
- FD002
- FD003
- FD004
seeds:
- 0
- 1
- 2
- 3
- 4
arm:
  name: sensor_order
  sensor_order: configs/arms/sensor_orders.json
determinism: strict (torch.use_deterministic_algorithms(True, warn_only=False), CUBLAS_WORKSPACE_CONFIG=:4096:8, deterministic
  memory fill)
test_read: none (validation only)
paths:
  data_dir: ${SACA_DATA_DIR:-../workspace/code_base/Data}
  splits: configs/data_splits.json
  output_dir: ${SACA_OUTPUT_DIR:-results/runs}/exp_B18
  frozen_dir: ${SACA_FROZEN_ROOT:-../workspace/experiments}/round_03/exp_B18
  test_log: ${SACA_TEST_LOG:-results/test_eval_log.csv}
