# D4 training-size arm: nested engine sub-sample, fraction 0.75 of TR; pipeline refit on the sub-sample.
description: 'D4 training-size arm: nested engine sub-sample, fraction 0.75 of TR; pipeline refit on the sub-sample.'
experiment_id: exp_A10_f0.75
concerns:
- R0.18
- R1.13
- R2.13
family: r3_D4
protocol: configs/protocols/protocol_P2.yaml
selection: configs/selections/exp_A10_f0.75_config_selection_frozen.json
subsets:
- FD001
- FD002
- FD003
- FD004
seeds:
- 0
- 1
- 2
- 3
- 4
arm:
  name: f0.75
  tr_subsample:
    file: configs/arms/subsample_ids.json
    fraction: 0.75
determinism: strict (torch.use_deterministic_algorithms(True, warn_only=False), CUBLAS_WORKSPACE_CONFIG=:4096:8, deterministic
  memory fill)
test_read: evaluate_test (purpose r4_final_ablation)
paths:
  data_dir: ${SACA_DATA_DIR:-../workspace/code_base/Data}
  splits: configs/data_splits.json
  output_dir: ${SACA_OUTPUT_DIR:-results/runs}/exp_A10_f0.75
  frozen_dir: ${SACA_FROZEN_ROOT:-../workspace/experiments}/round_04/exp_A10/f0.75
  test_log: ${SACA_TEST_LOG:-results/test_eval_log.csv}
